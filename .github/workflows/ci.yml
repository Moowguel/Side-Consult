name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Testes (IA, analytics, ingestão, sessão)
        run: npm test
      - name: Pipeline de dados (smoke test)
        run: npx tsx prisma/seed.ts && npm run data:pipeline
      - name: Build
        run: npm run build
